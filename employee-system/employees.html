<!DOCTYPE html>
<html>
  <head>
    <title>Employee List</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  
  <body class="page-table">  
    <div class="container">
    
      <div class="page-header">
        <h2>Employee Directory</h2>
        <button class="back-btn" onclick="goBack()">Back</button>
      </div>
    
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Gender</th>
              <th>Marital</th>
              <th>Phone</th>
              <th>Email</th>
              <th>Address</th>
              <th>DOB</th>
              <th>Nationality</th>
              <th>Hire Date</th>
              <th>Department</th>
            </tr>
          </thead>
    
          <tbody id="employeeTable"></tbody>
        </table>
      </div>    
    </div>
  
  <script>
  function goBack() {
    window.location.href = "test1.html";
  }
  
  function loadEmployees() {
    fetch("http://localhost/employee-system/api/getEmployees.php")
      .then(res => res.json())
      .then(data => {
  
        const table = document.getElementById("employeeTable");
        table.innerHTML = "";
  
        data.forEach(emp => {
          table.innerHTML += `
            <tr>
              <td>${emp.name || ""}</td>
              <td>${emp.gender || ""}</td>
              <td>${emp.maritalStatus || ""}</td>
              <td>${emp.phone || ""}</td>
              <td>${emp.email || ""}</td>
              <td>${emp.address || ""}</td>
              <td>${emp.dob || ""}</td>
              <td>${emp.nationality || ""}</td>
              <td>${emp.hireDate || ""}</td>
              <td>${emp.department || ""}</td>
            </tr>
          `;
        });
      })
  }
  function toggleRow(index) {
    const row = document.getElementById("detail-" + index);
    row.style.display = row.style.display === "table-row" ? "none" : "table-row";
  }
  
  loadEmployees();
  </script>

  </body>
</html>
